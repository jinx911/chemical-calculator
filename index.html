<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <meta name="description" content="比选液体管线管径，校核流速与压降，保存设计版本并导出计算书。">
  <title>管径与压降 · 化工工艺工作台</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./print.css" media="print">
  <script type="module" src="./src/app.mjs"></script>
  <script type="module" src="./src/formula-dock.mjs"></script>
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <div class="topbar-content">
        <button class="brand" type="button" data-action="home" aria-label="化工工艺工作台首页">
          <span class="brand-icon" aria-hidden="true">∿</span>
          <span>ChemCalc<small>化工工艺工作台</small></span>
        </button>
        <div class="header-tools">
          <span class="local-state"><span></span>保存在此浏览器</span>
        </div>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar" aria-label="项目和计算单" id="sidebar"></aside>
      <main class="workspace" id="workspace">
        <p class="loading">正在打开工作台…</p>
      </main>
    </div>
    <aside id="formula-dock" class="formula-dock" aria-labelledby="formula-dock-title" hidden>
      <header class="formula-dock-head">
        <h2 id="formula-dock-title">公式计算</h2>
        <button type="button" class="button" id="close-formulas" aria-label="收起公式计算">收起</button>
      </header>
      <div id="formula-dock-body" class="formula-dock-body"></div>
    </aside>
    <button type="button" id="open-formulas" class="button primary formula-launcher"
      aria-controls="formula-dock" aria-expanded="false" hidden>
      <span aria-hidden="true">ƒ</span>公式计算
    </button>
    <input type="file" id="import-project" accept=".json,application/json" hidden aria-label="选择项目文件">
    <p id="notice" class="notice" role="status" hidden></p>
    <noscript><p class="notice">请启用 JavaScript 以使用计算工作台。</p></noscript>
  </div>
  <main id="report" hidden></main>
</body>
</html>
